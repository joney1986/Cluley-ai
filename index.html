<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Real-Time Transcriber</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #controls { padding: 10px; border-bottom: 1px solid #ccc; }
        #content { display: flex; flex: 1; }
        #transcript-container { flex: 1; padding: 10px; border-right: 1px solid #ccc; overflow-y: auto; }
        #suggestions-container { flex: 1; padding: 10px; overflow-y: auto; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <div id="prep-container" style="padding: 10px; border-bottom: 1px solid #ccc;">
        <h3>Preparation</h3>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="resume-input">Your Resume:</label>
                <textarea id="resume-input" style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
            </div>
            <div style="flex: 1;">
                <label for="job-desc-input">Job Description:</label>
                <textarea id="job-desc-input" style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
            </div>
        </div>
    </div>
    <div id="controls" style="display: flex; align-items: center;">
        <button id="startStopBtn">Start Recording</button>
        <label style="margin-left: 20px;">
            <input type="checkbox" id="stealth-mode-toggle">
            Stealth Mode
        </label>
    </div>
    <div id="content">
        <div id="transcript-container">
            <h2>Live Transcript</h2>
            <div id="transcript"></div>
        </div>
        <div id="suggestions-container">
            <h2>Suggestions</h2>
            <div id="suggestions"></div>
        </div>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
